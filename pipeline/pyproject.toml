[project]
name = "tally"
version = "0.1.0"
description = "Turns a meeting recording into a named transcript and a summary."
requires-python = ">=3.12,<3.14"
dependencies = [
    "strands-agents==1.62.*",
    "boto3>=1.40",
    "numpy>=2.1",
]

[project.optional-dependencies]
# The models, for `tally prepare` and `retranscribe`: x86 only (torchcodec has no aarch64 wheels), so only the image installs them.
ml = [
    "whisperx==3.8.6",
    "pyannote.audio==4.0.7",
]

[project.scripts]
tally = "tally.cli:main"
tally-job = "tally.job:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tally"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
