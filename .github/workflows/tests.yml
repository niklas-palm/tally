# The checks that need no AWS, on every pull request: the pipeline's and the API's tests, the Windows app's Core
# tests, and that the Windows app builds. The Mac app's tests need macOS 26 and its Command Line Tools: run
# `make app-test` on a Mac.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg  # a test cuts a clip, as the job does
      - run: cp config.example.json config.json  # the Makefile reads it; the tests don't touch AWS
      - run: make test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          global-json-file: apps/windows/global.json
      - run: dotnet test --project Tally.Core.Tests  # from apps/windows, whose global.json picks the test runner
        working-directory: apps/windows
      - name: The PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($script in 'site/install.ps1', 'apps/windows/settings.ps1', 'apps/windows/uninstall.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
      - name: Build the app, with placeholder settings
        shell: pwsh
        run: |
          New-Item apps/windows/.build -ItemType Directory -Force | Out-Null
          @{ authorization = 'https://auth.example.com/authorize'; token = 'https://auth.example.com/token'; clientId = 'tally'
             signInName = 'Example'; api = 'https://api.example.com'; site = 'https://tally.example.com' } |
            ConvertTo-Json | Set-Content apps/windows/.build/tally.json
          dotnet publish apps/windows/Tally/Tally.csproj -c Release -r win-x64 -p:Platform=x64 -o build
