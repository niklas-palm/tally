name: Bug report
description: Something in Tally doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. For a security problem, don't use an issue: see SECURITY.md.
        Never attach recordings, transcripts or anything from someone's meeting.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [The Mac app, The Windows app, The pipeline (transcript, speakers, summary), The API, Deploying (CDK, Makefile), The install page or dashboard, The docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. …\n2. …"
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Tally's version (the last \"installing\" line of its install log), macOS or Windows version, the commit you deployed"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The installer's log, the app's log, or the job's steps (they hold no meeting content). Remove anything that names your deployment.
      render: text
