name: Bug report
description: Something in Tally doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, see SECURITY.md instead. Never attach recordings, transcripts or anything from a meeting.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Which part (the Mac app, the Windows app, the pipeline, deploying), and how to make it happen.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Tally's version (the last \"installing\" line of its install log), macOS or Windows version, the commit you deployed"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The installer's or app's log, or the job's steps. Remove anything that names your deployment.
      render: text
